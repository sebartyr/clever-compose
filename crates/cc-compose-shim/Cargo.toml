[package]
name = "cc-compose-shim"
description = "PID 1 des conteneurs générés par clever-compose : relais de port, signaux, exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cc-shim"
path = "src/main.rs"

[dependencies]
cc-compose-model.workspace = true
serde_json.workspace = true
libc = { version = "0.2", default-features = false }
tokio = { version = "1", default-features = false, features = [
    "rt",
    "net",
    "io-util",
    "signal",
    "time",
    "macros",
    "sync",
] }
