[package]
name = "cc-compose"
description = "Déploie un docker compose sur Clever Cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cc_compose"
path = "src/lib.rs"

[[bin]]
name = "clever-compose"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cc-compose-model.workspace = true
clevercloud-sdk = "1.0.1"
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
indexmap.workspace = true
jsonschema.workspace = true
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
saphyr.workspace = true
saphyr-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
pretty_assertions = "1"
