[package]
name = "cc-compose"
description = "Déploie un docker compose sur Clever Cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cc_compose"
path = "src/lib.rs"

[[bin]]
name = "clever-compose"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
# La même version que celle d'oauth10a (client signé du SDK) ; appels
# OAuth non signés de la danse (`auth.rs`).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
cc-compose-model.workspace = true
clevercloud-sdk = "1.0.1"
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
globset = "0.4"
indexmap.workspace = true
jsonschema.workspace = true
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
saphyr.workspace = true
saphyr-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "io-util"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
axum = { version = "0.8", features = ["json", "multipart"], optional = true }
tokio-stream = { version = "0.1", optional = true }
rust-embed = { version = "8", features = ["include-exclude"], optional = true }
mime_guess = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
tar = "0.4"
flate2 = "1"
rusty-s3 = "0.10"
quick-xml = "0.37"

# Trois binaires possibles :
#   cargo build --release                                   CLI + API + interface
#   cargo build --release --no-default-features --features api   CLI + API (interface servie ailleurs)
#   cargo build --release --no-default-features             CLI seule (exécution locale ou distante par --api-url)
[features]
default = ["ui"]
# Serveur HTTP : commande `api`, routes JSON/SSE.
api = ["dep:axum", "dep:tokio-stream", "dep:zip"]
# Interface embarquée (sources ESM + CDN) : commande `ui`.
ui = ["api", "dep:rust-embed", "dep:mime_guess"]
# Interface empaquetée par Vite (`web/dist`, `npm run build`) au lieu des
# sources + CDN.
ui-bundled = ["ui"]

[dev-dependencies]
pretty_assertions = "1"
# Tests de route du serveur (`oneshot` sur le `Router`).
tower = { version = "0.5", features = ["util"] }
