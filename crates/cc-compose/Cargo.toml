[package]
name = "cc-compose"
description = "Déploie un docker compose sur Clever Cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cc_compose"
path = "src/lib.rs"

[[bin]]
name = "clever-compose"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
cc-compose-model.workspace = true
clevercloud-sdk = "1.0.1"
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
globset = "0.4"
indexmap.workspace = true
jsonschema.workspace = true
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
saphyr.workspace = true
saphyr-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
axum = { version = "0.8", features = ["json", "multipart"] }
tokio-stream = "0.1"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
rusty-s3 = "0.10"
quick-xml = "0.37"

[features]
default = []
# Interface web empaquetée par Vite (`web/dist`, `npm run build`) ; sinon la
# page charge Vue et @clevercloud/components depuis esm.sh à l'usage.
ui-bundled = []

[dev-dependencies]
pretty_assertions = "1"
