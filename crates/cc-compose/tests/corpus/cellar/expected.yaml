name: cellar
services:
  db:
    environment:
      POSTGRES_PASSWORD: changeme
      POSTGRES_USER: vikunja
    image: postgres:18
    networks:
      default: null
  vikunja:
    environment:
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_HOST: db:8080
      VIKUNJA_DATABASE_PASSWORD: changeme
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_FILES_S3_REGION: us-east-1
      VIKUNJA_FILES_S3_USEPATHSTYLE: "true"
      VIKUNJA_FILES_TYPE: s3
    image: vikunja/vikunja:2.6.0
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3456
        published: "3456"
        protocol: tcp
    x-clever:
      cellar:
        - files
      environment:
        VIKUNJA_FILES_S3_ACCESSKEY: '{{files.key_id}}'
        VIKUNJA_FILES_S3_BUCKET: '{{files.bucket}}'
        VIKUNJA_FILES_S3_ENDPOINT: https://{{files.host}}
        VIKUNJA_FILES_S3_SECRETKEY: '{{files.key_secret}}'
networks:
  default:
    name: cellar_default
x-clever:
  cellar:
    files:
      buckets:
        - vikunja-files
