name: redirections
services:
  db:
    environment:
      POSTGRES_PASSWORD: secret
    image: postgres:16
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    x-clever:
      ephemeral: true
  game:
    image: gameserver:1
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
      - mode: ingress
        target: 27015
        published: "27015"
        protocol: udp
      - mode: ingress
        target: 27016
        published: "27016"
        protocol: tcp
    x-clever:
      tcp_namespace: cleverapps
networks:
  default:
    name: redirections_default
