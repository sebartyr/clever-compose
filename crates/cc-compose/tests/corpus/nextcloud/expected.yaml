name: nextcloud
services:
  db:
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_PASSWORD: nextcloud
      POSTGRES_USER: nextcloud
    expose:
      - "5432"
    image: postgres:alpine
    networks:
      default: null
    restart: always
    volumes:
      - type: volume
        source: db_data
        target: /var/lib/postgresql/data
        volume: {}
  nc:
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: nextcloud
      POSTGRES_USER: nextcloud
    image: nextcloud:apache
    networks:
      default: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
    restart: always
    volumes:
      - type: volume
        source: nc_data
        target: /var/www/html
        volume: {}
networks:
  default:
    name: nextcloud_default
volumes:
  db_data:
    name: nextcloud_db_data
  nc_data:
    name: nextcloud_nc_data
