name: documentdb
services:
  api:
    command:
      - sh
      - -c
      - while true; do sleep 30; done
    depends_on:
      mongo:
        condition: service_started
        required: true
    environment:
      MONGO_HOST: mongo
      MONGO_PASSWORD: app
      MONGO_URL: mongodb://app:app@mongo:27017/app?retryWrites=true
    image: busybox:1.36
    networks:
      default: null
  mongo:
    environment:
      MONGO_INITDB_DATABASE: app
      MONGO_INITDB_ROOT_PASSWORD: app
      MONGO_INITDB_ROOT_USERNAME: app
    image: mongo:7
    networks:
      default: null
    volumes:
      - type: bind
        source: <project>/initdb
        target: /docker-entrypoint-initdb.d
        bind: {}
networks:
  default:
    name: documentdb_default
