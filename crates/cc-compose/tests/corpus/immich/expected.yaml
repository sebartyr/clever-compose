name: immich
services:
  database:
    container_name: immich_postgres
    environment:
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck: {}
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    networks:
      default: null
    restart: always
    shm_size: "134217728"
    volumes:
      - type: bind
        source: <project>/postgres
        target: /var/lib/postgresql/data
        bind: {}
  immich-machine-learning:
    container_name: immich_machine_learning
    environment:
      DB_DATA_LOCATION: ./postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
      IMMICH_VERSION: v3
      UPLOAD_LOCATION: ./library
    healthcheck: {}
    image: ghcr.io/immich-app/immich-machine-learning:v3
    networks:
      default: null
    restart: always
    volumes:
      - type: volume
        source: model-cache
        target: /cache
        volume: {}
  immich-server:
    container_name: immich_server
    depends_on:
      database:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      DB_DATA_LOCATION: ./postgres
      DB_DATABASE_NAME: immich
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
      IMMICH_VERSION: v3
      UPLOAD_LOCATION: ./library
    healthcheck: {}
    image: ghcr.io/immich-app/immich-server:v3
    networks:
      default: null
    ports:
      - mode: ingress
        target: 2283
        published: "2283"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: <project>/library
        target: /data
        bind: {}
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind: {}
  redis:
    container_name: immich_redis
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG || exit 1
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    networks:
      default: null
    restart: always
networks:
  default:
    name: immich_default
volumes:
  model-cache:
    name: immich_model-cache
