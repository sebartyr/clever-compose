services:
  api:
    image: busybox:1.36
    command: sh -c "while true; do sleep 30; done"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
      DB_PASSWORD: app
    depends_on:
      - db
  db:
    image: postgres:16
    x-clever:
      version: "15"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}
