name: secrets
services:
  app:
    command:
      - sh
      - -c
      - cat /run/secrets/db_password /etc/app/token; sleep infinity
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
    image: busybox:1.36
    networks:
      default: null
    secrets:
      - source: db_password
        target: /run/secrets/db_password
      - source: api_token
        target: /etc/app/token
        uid: "1000"
        gid: "1000"
        mode: "0400"
networks:
  default:
    name: secrets_default
secrets:
  api_token:
    name: secrets_api_token
    environment: API_TOKEN
  db_password:
    name: secrets_db_password
    file: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/secrets/db_password.txt
