services:
  app:
    image: busybox:1.36
    command: sh -c "cat /run/secrets/db_password /etc/app/token; sleep infinity"
    secrets:
      - db_password
      - source: api_token
        target: /etc/app/token
        mode: 0400
        uid: "1000"
        gid: "1000"
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
secrets:
  db_password:
    file: ./db_password.txt
  api_token:
    environment: API_TOKEN
