name: nginx-proxy
services:
  app:
    command:
      - -listen=:8000
      - -text=bonjour depuis app
    image: hashicorp/http-echo:1.0
    networks:
      default: null
    x-clever:
      http_port: 8000
  front:
    depends_on:
      app:
        condition: service_started
        required: true
    image: nginx:1.27-alpine
    networks:
      default: null
    ports:
      - mode: ingress
        target: 80
        published: "8080"
        protocol: tcp
    volumes:
      - type: bind
        source: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/nginx-proxy/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: {}
networks:
  default:
    name: nginx-proxy_default
