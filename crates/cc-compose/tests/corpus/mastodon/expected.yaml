name: mastodon
services:
  db:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
    image: postgres:14-alpine
    networks:
      internal_network: null
    restart: always
    shm_size: "268435456"
    volumes:
      - type: bind
        source: <project>/postgres14
        target: /var/lib/postgresql/data
        bind: {}
  redis:
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
    image: redis:7-alpine
    networks:
      internal_network: null
    restart: always
    volumes:
      - type: bind
        source: <project>/redis
        target: /data
        bind: {}
  sidekiq:
    command:
      - bundle
      - exec
      - sidekiq
    depends_on:
      db:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      DB_HOST: /var/run/postgresql
      DB_NAME: mastodon_production
      DB_PASS: ""
      DB_PORT: "5432"
      DB_USER: mastodon
      ES_ENABLED: "true"
      ES_HOST: localhost
      ES_PASS: password
      ES_PORT: "9200"
      ES_USER: elastic
      IP_RETENTION_PERIOD: "31556952"
      LOCAL_DOMAIN: example.com
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      S3_ALIAS_HOST: files.example.com
      S3_BUCKET: files.example.com
      S3_ENABLED: "true"
      SECRET_KEY_BASE: ""
      SESSION_RETENTION_PERIOD: "31556952"
      SMTP_FROM_ADDRESS: notifications@example.com
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_PORT: "587"
      SMTP_SERVER: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_PUBLIC_KEY: ""
    healthcheck:
      test:
        - CMD-SHELL
        - ps aux | grep '[s]idekiq 8' || false
    image: ghcr.io/mastodon/mastodon:v4.7.1
    networks:
      external_network: null
      internal_network: null
    restart: always
    volumes:
      - type: bind
        source: <project>/public/system
        target: /mastodon/public/system
        bind: {}
  streaming:
    command:
      - node
      - ./streaming/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      DB_HOST: /var/run/postgresql
      DB_NAME: mastodon_production
      DB_PASS: ""
      DB_PORT: "5432"
      DB_USER: mastodon
      ES_ENABLED: "true"
      ES_HOST: localhost
      ES_PASS: password
      ES_PORT: "9200"
      ES_USER: elastic
      IP_RETENTION_PERIOD: "31556952"
      LOCAL_DOMAIN: example.com
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      S3_ALIAS_HOST: files.example.com
      S3_BUCKET: files.example.com
      S3_ENABLED: "true"
      SECRET_KEY_BASE: ""
      SESSION_RETENTION_PERIOD: "31556952"
      SMTP_FROM_ADDRESS: notifications@example.com
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_PORT: "587"
      SMTP_SERVER: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_PUBLIC_KEY: ""
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep
          -q 'OK' || exit 1
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.1
    networks:
      external_network: null
      internal_network: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 4000
        published: "4000"
        protocol: tcp
    restart: always
  web:
    command:
      - bundle
      - exec
      - puma
      - -C
      - config/puma.rb
    depends_on:
      db:
        condition: service_started
        required: true
      redis:
        condition: service_started
        required: true
    environment:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      DB_HOST: /var/run/postgresql
      DB_NAME: mastodon_production
      DB_PASS: ""
      DB_PORT: "5432"
      DB_USER: mastodon
      ES_ENABLED: "true"
      ES_HOST: localhost
      ES_PASS: password
      ES_PORT: "9200"
      ES_USER: elastic
      IP_RETENTION_PERIOD: "31556952"
      LOCAL_DOMAIN: example.com
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      S3_ALIAS_HOST: files.example.com
      S3_BUCKET: files.example.com
      S3_ENABLED: "true"
      SECRET_KEY_BASE: ""
      SESSION_RETENTION_PERIOD: "31556952"
      SMTP_FROM_ADDRESS: notifications@example.com
      SMTP_LOGIN: ""
      SMTP_PASSWORD: ""
      SMTP_PORT: "587"
      SMTP_SERVER: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_PUBLIC_KEY: ""
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit
          1
    image: ghcr.io/mastodon/mastodon:v4.7.1
    networks:
      external_network: null
      internal_network: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3000
        published: "3000"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: <project>/public/system
        target: /mastodon/public/system
        bind: {}
networks:
  external_network:
    name: mastodon_external_network
  internal_network:
    name: mastodon_internal_network
    internal: true
x-clever:
  network_groups: per-network
