name: sentry
services:
  attachments-consumer:
    build:
      context: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/sentry/sentry
      dockerfile: Dockerfile
      args:
        SENTRY_IMAGE: ghcr.io/getsentry/sentry:nightly
    command:
      - run
      - consumer
      - ingest-attachments
      - --consumer-group
      - ingest-consumer
      - --auto-offset-reset=earliest
      - --no-strict-offset-reset
      - --healthcheck-file-path
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      kafka:
        condition: service_healthy
        required: true
      memcached:
        condition: service_started
        required: true
      pgbouncer:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
      seaweedfs:
        condition: service_started
        required: true
      smtp:
        condition: service_started
        required: true
      snuba-api:
        condition: service_started
        required: true
      symbolicator:
        condition: service_started
        required: true
    entrypoint:
      - /etc/sentry/entrypoint.sh
    environment:
      COMPOSE_PROFILES: feature-complete
      DEFAULT_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      GRPC_DEFAULT_SSL_ROOTS_FILE_PATH_ENV_VAR: /etc/ssl/certs/ca-certificates.crt
      LAUNCHPAD_RPC_SHARED_SECRET: supersecret
      PYTHONUSERBASE: /data/custom-packages
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SENTRY_CONF: /etc/sentry
      SENTRY_EVENT_RETENTION_DAYS: "90"
      SENTRY_KAFKA_MAX_POLL_INTERVAL_MS: null
      SENTRY_MAIL_HOST: null
      SENTRY_MAX_EXTERNAL_SOURCEMAP_SIZE: null
      SENTRY_STATSD_ADDR: ""
      SENTRY_SYSTEM_SECRET_KEY: null
      SNUBA: http://snuba-api:1218
      VROOM: http://vroom:8085
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os, sys
          try:
              os.remove('/tmp/health.txt')
          except FileNotFoundError:
              print('consumer heartbeat file missing: /tmp/health.txt', file=sys.stderr)
              sys.exit(1)
      timeout: 10s
      interval: 1m0s
      retries: 3
      start_period: 10m0s
    image: sentry-self-hosted-local
    networks:
      default: null
    pull_policy: never
    restart: unless-stopped
    volumes:
      - type: volume
        source: sentry-data
        target: /data
        volume: {}
      - type: bind
        source: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/sentry/sentry
        target: /etc/sentry
        bind: {}
      - type: bind
        source: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/sentry/geoip
        target: /geoip
        read_only: true
        bind: {}
      - type: bind
        source: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/sentry/certificates
        target: /usr/local/share/ca-certificates
        read_only: true
        bind: {}
  clickhouse:
    build:
      context: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/sentry/clickhouse
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: altinity/clickhouse-server:25.8.28.10001.altinitystable
    environment:
      MAX_MEMORY_USAGE_RATIO: "0.3"
    healthcheck:
      test:
        - CMD-SHELL
        - HTTP_PROXY='' http_proxy='' wget -nv -t1 --spider 'http://localhost:8123/'
          || exit 1
      timeout: 10s
      interval: 10s
      retries: 30
    image: clickhouse-self-hosted-local
    networks:
      default: null
    pull_policy: never
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - type: volume
        source: sentry-clickhouse
        target: /var/lib/clickhouse
        volume: {}
      - type: volume
        source: sentry-clickhouse-log
        target: /var/log/clickhouse-server
        volume: {}
      - type: bind
        source: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/sentry/clickhouse/config.xml
        target: /etc/clickhouse-server/config.d/sentry.xml
        read_only: true
      - type: bind
        source: /home/sebartyr/cc-compose/clever-compose/crates/cc-compose/tests/corpus/sentry/clickhouse/default-password.xml
        target: /etc/clickhouse-server/users.d/default-password.xml
