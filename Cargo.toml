[workspace]
resolver = "2"
members = [
    "crates/cc-compose-model",
    "crates/cc-compose-shim",
    "crates/cc-compose",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CleverCloud/clever-compose"

[workspace.dependencies]
cc-compose-model = { path = "crates/cc-compose-model" }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
saphyr = "0.0.12"
saphyr-parser = "0.0.12"
thiserror = "2"
jsonschema = { version = "0.56", default-features = false }
sha2 = "0.11"

# Profil dédié au shim : binaire statique musl, minimal, sans unwinding.
# `cargo build -p cc-compose-shim --profile shim --target x86_64-unknown-linux-musl`
[profile.shim]
inherits = "release"
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true

[patch.crates-io]
saphyr-parser = { path = "vendor/saphyr-parser" }
